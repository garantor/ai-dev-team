name: "🚀 AI Orchestrator"
description: "Submit a high-level idea and let AI agents plan and implement it"
title: "[ORCHESTRATE] "
labels: ["orchestrator", "needs-planning"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 🤖 AI Orchestrator - Fully Autonomous Workflow
        
        Submit your high-level product idea here. The AI team will automatically:
        1. **Analyze** your idea and break it down into detailed features
        2. **Plan** the technical architecture and implementation timeline
        3. **Present** the plan for your approval (you have full control!)
        4. **Execute** by creating and assigning all agent issues after approval
        
        **All you need is one sentence describing what you want to build!**

  - type: textarea
    id: product-idea
    attributes:
      label: "💡 Your Product Idea"
      description: "Describe what you want to build in 1-3 sentences"
      placeholder: |
        Example: "I want to create a web app that integrates with Uniswap for blockchain swapping"
        
        Example: "Build a task management app with real-time collaboration and AI-powered suggestions"
        
        Example: "Create a social media dashboard that aggregates posts from Twitter, Instagram, and LinkedIn"
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: "📝 Additional Context (Optional)"
      description: "Any specific requirements, constraints, or preferences?"
      placeholder: |
        - Target users: Crypto traders
        - Must support: MetaMask, WalletConnect
        - Budget: $10k
        - Timeline: 4 weeks
        - Preferred tech: React, Node.js

  - type: dropdown
    id: priority
    attributes:
      label: "⚡ Priority"
      options:
        - "🔥 Urgent (start immediately)"
        - "🚀 High (this week)"
        - "📅 Medium (this month)"
        - "💭 Low (exploratory)"
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: "✅ Confirmation"
      options:
        - label: "I understand the Product Agent will analyze this and post a detailed plan for my approval"
          required: true
        - label: "I will review the plan and respond with APPROVE, REJECT, or REVISE"
          required: true

  - type: markdown
    attributes:
      value: |
        ---
        
        ## 🔄 Autonomous Workflow - What Happens Next?
        
        ### Step 1: Analysis (Automatic)
        The **Product Agent** will analyze your idea and post a detailed implementation plan including:
        - Feature breakdown (P0/P1/P2 priorities)
        - Technical architecture
        - Agent task assignments
        - Implementation timeline
        
        ### Step 2: Your Decision (Required)
        Review the plan and respond with ONE of these commands:
        
        | Command | What It Does |
        |---------|--------------|
        | `APPROVE` | ✅ Accept the plan → All agent issues are created automatically |
        | `REJECT` | ❌ Cancel this request → No issues created, workflow ends |
        | `REVISE: [feedback]` | 🔄 Request changes → Product Agent revises the plan |
        
        **Examples:**
        - `APPROVE` - Accept and start implementation
        - `REVISE: Use Python instead of Node.js` - Change tech stack
        - `REVISE: Add payment processing feature` - Add requirements
        - `REJECT` - Cancel this orchestration
        
        ### Step 3: Execution (Automatic after APPROVE)
        After you APPROVE:
        1. ✅ Backend Agent issues created
        2. ✅ Integration Agent issues created  
        3. ✅ Frontend Agent issues created
        4. ✅ QA Agent issues created
        5. ✅ Dependencies linked between issues
        6. ✅ Agents start implementing automatically
        
        ### Step 4: Review & Merge (Your Involvement)
        You only need to:
        - Review and merge Pull Requests
        - Test the final product
        - Provide feedback if needed
        
        ---
        
        **Read more:** [AI Orchestrator Guide](../docs/AI_ORCHESTRATOR_GUIDE.md)
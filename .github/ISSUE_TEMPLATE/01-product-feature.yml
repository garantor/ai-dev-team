name: "📋 Product Feature Request"
description: "Product Agent: Define new features and requirements"
title: "[FEATURE] "
labels: ["feature", "product", "needs-refinement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Product Agent Template
        Use this template to define new features that will be implemented by the dev team.

  - type: textarea
    id: user-story
    attributes:
      label: "User Story"
      description: "Describe the feature from the user's perspective"
      placeholder: "As a [user type], I want [goal] so that [benefit]"
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "Acceptance Criteria"
      description: "Define what 'done' looks like"
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3
    validations:
      required: true

  - type: textarea
    id: technical-requirements
    attributes:
      label: "Technical Requirements"
      description: "High-level technical needs"
      placeholder: |
        **Backend Requirements:**
        - API endpoints needed
        - Data models
        - Business logic

        **Frontend Requirements:**
        - UI components
        - User flows
        - State management

        **Integration Requirements:**
        - API contracts
        - Data transformations
        - Authentication needs

  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      options:
        - "🔴 Critical"
        - "🟠 High"
        - "🟡 Medium"
        - "🟢 Low"
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: "Mockups/Design References"
      description: "Link to designs or add screenshots"
      placeholder: "Figma link, screenshots, or wireframes"

  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies"
      description: "Other features or issues this depends on"
      placeholder: "Depends on #123, #456"

  - type: checkboxes
    id: agents-needed
    attributes:
      label: "Agents Required"
      description: "Which agents need to work on this?"
      options:
        - label: "Backend Agent"
        - label: "Frontend Agent"
        - label: "Integration Agent"
        - label: "QA/Test Agent"
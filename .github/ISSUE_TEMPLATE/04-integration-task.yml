name: "🔌 Integration Task"
description: "Integration Agent: API clients, contracts, and bridges"
title: "[INTEGRATION] "
labels: ["integration", "in-progress"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Integration Agent Template
        Use this for API integration and contract work.

  - type: input
    id: parent-issue
    attributes:
      label: "Parent Feature Issue"
      description: "Link to the product feature this supports"
      placeholder: "#123"

  - type: dropdown
    id: task-type
    attributes:
      label: "Task Type"
      options:
        - "API Client Generation"
        - "Type Definitions"
        - "API Mocking"
        - "Contract Testing"
        - "SDK Development"
        - "API Versioning"
        - "WebSocket Integration"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "What needs to be integrated?"
      placeholder: |
        Generate API client for User endpoints
        - Create TypeScript client from OpenAPI spec
        - Add request/response types
        - Implement error handling
    validations:
      required: true

  - type: input
    id: backend-issue
    attributes:
      label: "Backend Issue Reference"
      description: "Link to backend implementation"
      placeholder: "#456"

  - type: input
    id: frontend-issue
    attributes:
      label: "Frontend Issue Reference"
      description: "Link to frontend implementation"
      placeholder: "#457"

  - type: textarea
    id: api-endpoints
    attributes:
      label: "API Endpoints"
      description: "List all endpoints to integrate"
      placeholder: |
        - GET /api/v1/users/:id
        - PATCH /api/v1/users/:id
        - DELETE /api/v1/users/:id

  - type: textarea
    id: contract-spec
    attributes:
      label: "API Contract Specification"
      description: "Define the contract between frontend and backend"
      placeholder: |
        **Source:** OpenAPI spec at `/docs/openapi.yaml`
        **Output:** TypeScript types in `/src/types/api/`
        **Client:** Generated client in `/src/api/client/`

  - type: textarea
    id: deliverables
    attributes:
      label: "Deliverables"
      description: "What will be provided to Frontend Agent?"
      placeholder: |
        - [ ] API client methods (e.g., `userApi.getById()`)                
        - [ ] TypeScript interfaces
        - [ ] Mock data for development
        - [ ] Request/response interceptors
        - [ ] Error handling utilities

  - type: checkboxes
    id: checklist
    attributes:
      label: "Implementation Checklist"
      options:
        - label: "OpenAPI spec validated"
        - label: "API client generated/written"
        - label: "TypeScript types created"
        - label: "Mock server configured"
        - label: "Contract tests written"
        - label: "Documentation updated"
        - label: "Frontend Agent notified"
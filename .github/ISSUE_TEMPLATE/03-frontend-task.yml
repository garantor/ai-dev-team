name: "🎨 Frontend Task"
description: "Frontend Agent: UI components and client-side logic"
title: "[FRONTEND] "
labels: ["frontend", "in-progress"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Frontend Agent Template
        Use this for frontend implementation tasks.

  - type: input
    id: parent-issue
    attributes:
      label: "Parent Feature Issue"
      description: "Link to the product feature this implements"
      placeholder: "#123"

  - type: dropdown
    id: task-type
    attributes:
      label: "Task Type"
      options:
        - "New Component"
        - "Page/Route"
        - "State Management"
        - "Form Implementation"
        - "UI Enhancement"
        - "Bug Fix"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "What needs to be built?"
      placeholder: |
        Create UserProfile component
        - Display user information
        - Handle loading/error states
        - Responsive design (mobile, tablet, desktop)
    validations:
      required: true

  - type: textarea
    id: api-dependencies
    attributes:
      label: "API Dependencies"
      description: "Which APIs does this component need?"
      placeholder: |
        - GET /api/v1/users/:id
        - PATCH /api/v1/users/:id
        
        Waiting for Integration Agent to provide:
        - API client methods
        - TypeScript types

  - type: textarea
    id: components
    attributes:
      label: "Components to Build"
      description: "List all components needed"
      placeholder: |
        - UserProfileCard (main component)
        - UserAvatar (child component)
        - UserStats (child component)
        - EditProfileModal (modal)

  - type: textarea
    id: design-reference
    attributes:
      label: "Design Reference"
      description: "Link to designs or mockups"
      placeholder: "Figma: https://figma.com/..."

  - type: checkboxes
    id: checklist
    attributes:
      label: "Implementation Checklist"
      options:
        - label: "Components created"
        - label: "API integration completed"
        - label: "Loading states handled"
        - label: "Error states handled"
        - label: "Responsive design implemented"
        - label: "Accessibility (a11y) tested"
        - label: "Unit tests written"
        - label: "Storybook stories added (if applicable)"
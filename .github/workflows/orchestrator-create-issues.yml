name: Orchestrator - Create Issues

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  create_issues:
    runs-on: ubuntu-latest
    # Only run when creating-issues label is added to orchestrator issue
    if: |
      contains(github.event.issue.labels.*.name, 'orchestrator') &&
      contains(github.event.issue.labels.*.name, 'creating-issues') &&
      github.event.label.name == 'creating-issues'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create issues from plan
        uses: actions/github-script@v7
        with:
          script: |
            const scriptPath = `${process.env.GITHUB_WORKSPACE}/scripts/orchestrator-issue-creator.js`;
            const createIssues = require(scriptPath);
            await createIssues({ github, context, core });

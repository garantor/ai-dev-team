name: Orchestrator - Progress Tracking

on:
  schedule:
    # Run daily at 9 AM UTC
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual triggering
  issues:
    types: [closed, labeled]
  pull_request:
    types: [opened, closed]

permissions:
  issues: write
  contents: read

jobs:
  track_progress:
    runs-on: ubuntu-latest
    
    steps:
      - name: Find all active orchestrator issues
        id: find_orchestrators
        uses: actions/github-script@v7
        with:
          script: |
            const { data: orchestrators } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'orchestrator,in-progress',
              state: 'open',
              per_page: 100
            });
            
            console.log(`Found ${orchestrators.length} active orchestrator issues`);
            
            const orchestratorNumbers = orchestrators.map(o => o.number);
            core.setOutput('orchestrator_numbers', JSON.stringify(orchestratorNumbers));
            core.setOutput('has_orchestrators', orchestrators.length > 0 ? 'true' : 'false');
            
            return orchestratorNumbers;

      - name: Generate progress reports
        if: steps.find_orchestrators.outputs.has_orchestrators == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const orchestratorNumbers = JSON.parse('${{ steps.find_orchestrators.outputs.orchestrator_numbers }}');
            
            for (const orchestratorNumber of orchestratorNumbers) {
              try {
                await generateProgressReport(github, context, orchestratorNumber);
              } catch (error) {
                console.log(`Error generating report for #${orchestratorNumber}: ${error.message}`);
              }
            }
            
            // Helper function to generate progress report
            async function generateProgressReport(github, context, orchestratorNumber) {
              console.log(`Generating progress report for orchestrator #${orchestratorNumber}`);
              
              // Get all issues linked to this orchestrator
              const { data: allIssues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                per_page: 100
              });
              
              const linkedIssues = allIssues.filter(issue => {
                const body = issue.body || '';
                return body.includes(`Parent Issue: #${orchestratorNumber}`) && 
                       issue.number !== orchestratorNumber;
              });
              
              if (linkedIssues.length === 0) {
                console.log('No linked issues found');
                return;
              }
              
              // Calculate statistics
              const totalIssues = linkedIssues.length;
              const completed = linkedIssues.filter(i => i.state === 'closed');
              const inReview = linkedIssues.filter(i => 
                i.state === 'open' && i.labels.some(l => l.name === 'in-review')
              );
              const ready = linkedIssues.filter(i => 
                i.state === 'open' && i.labels.some(l => l.name === 'ready')
              );
              const blocked = linkedIssues.filter(i => 
                i.state === 'open' && i.labels.some(l => l.name === 'blocked')
              );
              
              const completedCount = completed.length;
              const inReviewCount = inReview.length;
              const readyCount = ready.length;
              const blockedCount = blocked.length;
              const inProgressCount = totalIssues - completedCount - inReviewCount - readyCount - blockedCount;
              
              const completedPct = Math.round((completedCount / totalIssues) * 100);
              const inReviewPct = Math.round((inReviewCount / totalIssues) * 100);
              const readyPct = Math.round((readyCount / totalIssues) * 100);
              const blockedPct = Math.round((blockedCount / totalIssues) * 100);
              
              // Determine overall status
              let overallStatus = '🟢 On Track';
              let statusMessage = 'Everything is progressing smoothly.';
              
              if (blockedPct > 30) {
                overallStatus = '🔴 Blocked';
                statusMessage = 'Multiple issues are blocked. Review dependencies.';
              } else if (blockedPct > 15) {
                overallStatus = '🟡 At Risk';
                statusMessage = 'Some issues are blocked. Monitor closely.';
              } else if (completedPct > 75) {
                overallStatus = '🟢 Nearly Complete';
                statusMessage = 'Great progress! Most work is done.';
              }
              
              // Get recent activity (last 24 hours)
              const oneDayAgo = new Date(Date.now() - 24 * 60 * 60 * 1000);
              const recentlyClosed = completed.filter(i => 
                new Date(i.closed_at) > oneDayAgo
              );
              const recentlyOpened = inReview.filter(i => 
                new Date(i.created_at) > oneDayAgo
              );
              
              // Group issues by agent type
              const byAgent = {
                backend: [],
                integration: [],
                frontend: [],
                qa: [],
                other: []
              };
              
              linkedIssues.forEach(issue => {
                const labels = issue.labels.map(l => l.name);
                if (labels.includes('backend')) byAgent.backend.push(issue);
                else if (labels.includes('integration')) byAgent.integration.push(issue);
                else if (labels.includes('frontend')) byAgent.frontend.push(issue);
                else if (labels.includes('qa')) byAgent.qa.push(issue);
                else byAgent.other.push(issue);
              });
              
              // Build progress report
              const now = new Date();
              const dateStr = now.toISOString().split('T')[0];
              
              let report = `## 📊 Progress Report - ${dateStr}\n\n`;
              report += `**Overall:** ${overallStatus}\n`;
              report += `${statusMessage}\n\n`;
              
              report += `### Summary\n\n`;
              report += `| Status | Count | Percentage |\n`;
              report += `|--------|-------|------------|\n`;
              report += `| ✅ Completed | ${completedCount} | ${completedPct}% |\n`;
              report += `| 🔄 In Review | ${inReviewCount} | ${inReviewPct}% |\n`;
              report += `| 🟢 Ready | ${readyCount} | ${readyPct}% |\n`;
              report += `| ⏳ In Progress | ${inProgressCount} | ${Math.round((inProgressCount / totalIssues) * 100)}% |\n`;
              report += `| 🚫 Blocked | ${blockedCount} | ${blockedPct}% |\n`;
              report += `| **Total** | **${totalIssues}** | **100%** |\n\n`;
              
              // Progress bar
              const progressBar = '█'.repeat(Math.floor(completedPct / 5)) + 
                                 '░'.repeat(20 - Math.floor(completedPct / 5));
              report += `**Progress:** [${progressBar}] ${completedPct}%\n\n`;
              
              // Recent activity
              if (recentlyClosed.length > 0 || recentlyOpened.length > 0) {
                report += `### 📈 Recent Activity (Last 24 Hours)\n\n`;
                
                if (recentlyClosed.length > 0) {
                  report += `**Completed:**\n`;
                  recentlyClosed.slice(0, 5).forEach(issue => {
                    const agentType = issue.labels.find(l => 
                      ['backend', 'integration', 'frontend', 'qa'].includes(l.name)
                    )?.name || 'agent';
                    report += `- ✅ [${agentType.toUpperCase()}] #${issue.number} - ${issue.title.replace(/^\[.*?\]\s*/, '')}\n`;
                  });
                  if (recentlyClosed.length > 5) {
                    report += `- ... and ${recentlyClosed.length - 5} more\n`;
                  }
                  report += `\n`;
                }
                
                if (recentlyOpened.length > 0) {
                  report += `**In Review:**\n`;
                  recentlyOpened.slice(0, 5).forEach(issue => {
                    const agentType = issue.labels.find(l => 
                      ['backend', 'integration', 'frontend', 'qa'].includes(l.name)
                    )?.name || 'agent';
                    report += `- 🔄 [${agentType.toUpperCase()}] #${issue.number} - ${issue.title.replace(/^\[.*?\]\s*/, '')}\n`;
                  });
                  report += `\n`;
                }
              }
              
              // Agent breakdown
              report += `### 👥 Progress by Agent\n\n`;
              
              const agentEmojis = {
                backend: '⚙️',
                integration: '🔌',
                frontend: '🎨',
                qa: '🧪'
              };
              
              for (const [agentType, issues] of Object.entries(byAgent)) {
                if (issues.length === 0) continue;
                
                const emoji = agentEmojis[agentType] || '📝';
                const agentCompleted = issues.filter(i => i.state === 'closed').length;
                const agentTotal = issues.length;
                const agentPct = Math.round((agentCompleted / agentTotal) * 100);
                
                report += `**${emoji} ${agentType.charAt(0).toUpperCase() + agentType.slice(1)}:** `;
                report += `${agentCompleted}/${agentTotal} (${agentPct}%)\n`;
              }
              report += `\n`;
              
              // Next actions
              report += `### 🎯 Next Actions\n\n`;
              
              if (readyCount > 0) {
                report += `**Ready to start (${readyCount}):**\n`;
                ready.slice(0, 3).forEach(issue => {
                  report += `- #${issue.number} - ${issue.title.replace(/^\[.*?\]\s*/, '')}\n`;
                });
                if (readyCount > 3) {
                  report += `- ... and ${readyCount - 3} more\n`;
                }
                report += `\n`;
              }
              
              if (blockedCount > 0) {
                report += `**Blocked (${blockedCount}):**\n`;
                blocked.slice(0, 3).forEach(issue => {
                  const body = issue.body || '';
                  const depsMatch = body.match(/Depends on:\s*([^\n]+)/i);
                  const deps = depsMatch ? depsMatch[1] : 'dependencies';
                  report += `- #${issue.number} - ${issue.title.replace(/^\[.*?\]\s*/, '')} (waiting for ${deps})\n`;
                });
                if (blockedCount > 3) {
                  report += `- ... and ${blockedCount - 3} more\n`;
                }
                report += `\n`;
              }
              
              if (inReviewCount > 0) {
                report += `**Needs review (${inReviewCount}):**\n`;
                inReview.slice(0, 3).forEach(issue => {
                  report += `- #${issue.number} - ${issue.title.replace(/^\[.*?\]\s*/, '')}\n`;
                });
                if (inReviewCount > 3) {
                  report += `- ... and ${inReviewCount - 3} more\n`;
                }
                report += `\n`;
              }
              
              if (completedCount === totalIssues) {
                report += `🎉 **All issues completed!** This project is ready for final testing and deployment.\n\n`;
              }
              
              report += `---\n\n`;
              report += `*This report is automatically generated daily. Last updated: ${now.toUTCString()}*\n`;
              
              // Post the report
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: orchestratorNumber,
                body: report
              });
              
              console.log(`Progress report posted to orchestrator #${orchestratorNumber}`);
            }

name: Orchestrator - Instant Acknowledgment

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  acknowledge:
    # Only run if issue has 'orchestrator' label and doesn't already have 'processing' label
    if: |
      contains(github.event.issue.labels.*.name, 'orchestrator') &&
      !contains(github.event.issue.labels.*.name, 'processing')
    
    runs-on: ubuntu-latest
    
    steps:
      - name: Add Reaction to Issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              content: 'rocket'
            });

      - name: Post Acknowledgment Comment
        uses: actions/github-script@v7
        with:
          script: |
            const timestamp = new Date().toUTCString();
            
            const comment = `## 🤖 AI Dev Team Orchestrator

            ✅ **Your request has been received!**

            ### What's happening now:
            1. 🔍 **Analyzing your product idea** (currently in progress)
            2. ⏳ **Generating detailed implementation plan** (estimated 3-5 minutes)
            3. 📋 **Creating comprehensive task breakdown** (with technical architecture, agent assignments, and timeline)

            ### What to expect:
            - I'll post a **detailed product plan** as a comment below shortly
            - You'll be asked to review and comment:
              - \`APPROVE\` - to proceed with creating all agent issues
              - \`REVISE: [your feedback]\` - to request changes to the plan
              - \`REJECT\` - to cancel this request

            ### Need help?
            - Check out the [AI Orchestrator Guide](../../docs/AI_ORCHESTRATOR_GUIDE.md)
            - View example workflows in our [documentation](../../docs/)

            ---
            ⏰ *Started at: ${timestamp}*  
            🏷️ *Status: Processing*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

      - name: Add Processing Label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['processing']
            });

      - name: Remove Needs Planning Label
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'needs-planning'
              });
            } catch (error) {
              // Label might not exist, ignore
              console.log('needs-planning label not found or already removed');
            }

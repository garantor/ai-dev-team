name: Orchestrator - Instant Acknowledgment

on:
  issues:
    types: [opened]

permissions:
  issues: write

# Prevent concurrent runs for the same issue
concurrency:
  group: orchestrator-ack-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  acknowledge:
    # Only run if issue has 'orchestrator' label and
    # doesn't already have 'processing' label
    if: |
      contains(github.event.issue.labels.*.name, 'orchestrator') &&
      !contains(github.event.issue.labels.*.name, 'processing')

    runs-on: ubuntu-latest

    steps:
      - name: Check for existing acknowledgment
        id: check_ack
        uses: actions/github-script@v7
        with:
          script: |
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const hasAck = comments.data.some(c => 
              c.body.includes('AI Dev Team Orchestrator') && 
              c.body.includes('Your request has been received')
            );
            
            core.setOutput('already_acknowledged', hasAck);
            return hasAck;

      - name: Add Reaction to Issue
        if: steps.check_ack.outputs.already_acknowledged != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              content: 'rocket'
            });

      - name: Post Acknowledgment Comment
        if: steps.check_ack.outputs.already_acknowledged != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const timestamp = new Date().toUTCString();

            const comment = `## 🤖 AI Dev Team Orchestrator

            ✅ **Your request has been received!**

            ### What's happening now:
            1. 🔍 **Analyzing your product idea** (currently in progress)
            2. ⏳ **Generating detailed implementation plan** ` +
              `(estimated 3-5 minutes)
            3. 📋 **Creating comprehensive task breakdown** ` +
              `(with technical architecture, agent assignments, and timeline)

            ### What to expect:
            - I'll post a **detailed product plan** as a comment below shortly
            - You'll be asked to review and comment:
              - \`APPROVE\` - to proceed with creating all agent issues
              - \`REVISE: [your feedback]\` - to request changes to the plan
              - \`REJECT\` - to cancel this request

            ### Need help?
            - Check out the [AI Orchestrator Guide]` +
              `(../../docs/AI_ORCHESTRATOR_GUIDE.md)
            - View example workflows in our [documentation](../../docs/)

            ---
            ⏰ *Started at: ${timestamp}*
            🏷️ *Status: Processing*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

      - name: Add Processing Label
        if: steps.check_ack.outputs.already_acknowledged != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['processing', 'needs-planning']
            });


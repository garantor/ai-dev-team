name: Backend CI/CD Pipeline

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '18'
  AWS_REGION: 'us-east-1' # Replace with your AWS region
  ECR_REGISTRY_URL: 'YOUR_AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com' # Replace with your ECR URL
  ECR_REPOSITORY_NAME: 'backend-app' # Replace with your ECR repository name
  ECS_CLUSTER_NAME: 'your-ecs-cluster' # Replace with your ECS cluster name
  ECS_SERVICE_NAME: 'your-backend-service' # Replace with your ECS service name

jobs:
  lint_and_test:
    name: Lint and Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-package-lock
          fi

      - name: Run linting
        run: npm run lint # Assumes 'npm run lint' script exists in backend's package.json

      - name: Run unit and integration tests
        run: npm test # Assumes 'npm test' script exists in backend's package.json

  build_and_push_docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: lint_and_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t ${{ env.ECR_REPOSITORY_NAME }}:${{ env.IMAGE_TAG }} .
          docker tag ${{ env.ECR_REPOSITORY_NAME }}:${{ env.IMAGE_TAG }} ${{ env.ECR_REGISTRY_URL }}/${{ env.ECR_REPOSITORY_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY_URL }}/${{ env.ECR_REPOSITORY_NAME }}:${{ env.IMAGE_TAG }}

  deploy_to_staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: build_and_push_docker
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to ECS Staging
        env:
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ env.AWS_REGION }}
          ECS_CLUSTER_NAME: ${{ env.ECS_CLUSTER_NAME }}
          ECS_SERVICE_NAME: ${{ env.ECS_SERVICE_NAME }}
          ECR_REGISTRY_URL: ${{ env.ECR_REGISTRY_URL }}
          ECR_REPOSITORY_NAME: ${{ env.ECR_REPOSITORY_NAME }}
        run: |
          chmod +x integration/backend/scripts/deploy_staging.sh
          integration/backend/scripts/deploy_staging.sh

name: Setup GitHub Labels

on:
  workflow_dispatch: # Manual trigger
  push:
    branches:
      - main
    paths:
      - '.github/workflows/setup-labels.yml'

permissions:
  issues: write
  contents: read

jobs:
  create-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or update labels
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              // Orchestrator Labels
              { name: 'orchestrator', color: '8B5CF6', description: 'AI Orchestrator issue for automated planning' },
              { name: 'needs-planning', color: 'FCD34D', description: 'Awaiting Product Agent analysis' },
              { name: 'awaiting-approval', color: 'FB923C', description: 'Plan generated, waiting for approval' },
              { name: 'approved', color: '10B981', description: 'Plan approved, ready for implementation' },
              { name: 'processing', color: '3B82F6', description: 'Currently being processed' },
              { name: 'creating-issues', color: '6366F1', description: 'Creating agent issues' },
              { name: 'rejected', color: 'EF4444', description: 'Request rejected' },
              
              // Agent Labels
              { name: 'product', color: '8B5CF6', description: 'Product Agent tasks' },
              { name: 'backend', color: 'DC2626', description: 'Backend Agent tasks' },
              { name: 'frontend', color: '2563EB', description: 'Frontend Agent tasks' },
              { name: 'integration', color: '059669', description: 'Integration Agent tasks' },
              { name: 'qa', color: 'D97706', description: 'QA Agent tasks' },
              
              // Priority Labels
              { name: 'P0', color: 'DC2626', description: 'Critical priority' },
              { name: 'P1', color: 'F59E0B', description: 'High priority' },
              { name: 'P2', color: '3B82F6', description: 'Medium priority' },
              { name: 'P3', color: '6B7280', description: 'Low priority' },
              
              // Status Labels
              { name: 'blocked', color: 'DC2626', description: 'Blocked by dependencies' },
              { name: 'ready', color: '10B981', description: 'Ready to start' },
              { name: 'in-progress', color: 'FBBF24', description: 'Work in progress' },
              { name: 'in-review', color: '8B5CF6', description: 'In code review' },
              { name: 'done', color: '059669', description: 'Completed' },
              
              // Type Labels
              { name: 'feature', color: '10B981', description: 'New feature' },
              { name: 'bug', color: 'DC2626', description: 'Bug report' },
              { name: 'enhancement', color: '3B82F6', description: 'Enhancement' },
              { name: 'documentation', color: '6B7280', description: 'Documentation' }
            ];

            for (const label of labels) {
              try {
                // Try to get the label first
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });
                
                // If it exists, update it
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
                
                console.log(`✓ Updated label: ${label.name}`);
              } catch (error) {
                if (error.status === 404) {
                  // Label doesn't exist, create it
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                  
                  console.log(`✓ Created label: ${label.name}`);
                } else {
                  console.error(`✗ Error processing label ${label.name}:`, error.message);
                  throw error;
                }
              }
            }
            
            console.log(`\n✅ Successfully processed ${labels.length} labels`);

      - name: Generate summary
        run: |
          echo "## ✅ Label Setup Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All GitHub labels have been created/updated:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Orchestrator Labels**: 7 labels" >> $GITHUB_STEP_SUMMARY
          echo "- **Agent Labels**: 5 labels" >> $GITHUB_STEP_SUMMARY
          echo "- **Priority Labels**: 4 labels" >> $GITHUB_STEP_SUMMARY
          echo "- **Status Labels**: 5 labels" >> $GITHUB_STEP_SUMMARY
          echo "- **Type Labels**: 4 labels" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total**: 25 labels" >> $GITHUB_STEP_SUMMARY

name: Agent Coordinator

on:
  issues:
    types: [opened, closed, labeled, unlabeled]
  pull_request:
    types: [opened, closed]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: write

jobs:
  coordinate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Handle issue closed (dependency resolution)
        if: github.event_name == 'issues' && github.event.action == 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const { updateOrchestratorProgress } = require('./scripts/orchestrator-progress-helper');
            const closedIssue = context.payload.issue.number;
            
            console.log(`Issue #${closedIssue} was closed. Checking for dependent issues...`);
            
            // Find all open issues that depend on this issue
            const { data: allIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            
            const dependentIssues = allIssues.filter(issue => {
              const body = issue.body || '';
              // Check if this issue depends on the closed issue
              const dependsPattern = new RegExp(`Depends on:.*#${closedIssue}\\b`, 'i');
              return dependsPattern.test(body);
            });
            
            console.log(`Found ${dependentIssues.length} dependent issues`);
            
            for (const issue of dependentIssues) {
              const body = issue.body || '';
              
              // Extract all dependencies
              const depsMatch = body.match(/Depends on:\s*([^\n]+)/i);
              if (!depsMatch) continue;
              
              const deps = depsMatch[1].match(/#(\d+)/g).map(d => parseInt(d.replace('#', '')));
              
              // Check if all dependencies are closed
              let allDepsClosed = true;
              const depStatuses = [];
              
              for (const dep of deps) {
                try {
                  const { data: depIssue } = await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: dep
                  });
                  
                  depStatuses.push({
                    number: dep,
                    closed: depIssue.state === 'closed'
                  });
                  
                  if (depIssue.state !== 'closed') {
                    allDepsClosed = false;
                  }
                } catch (error) {
                  console.log(`Could not check dependency #${dep}: ${error.message}`);
                }
              }
              
              if (allDepsClosed) {
                console.log(`All dependencies resolved for issue #${issue.number}. Unblocking...`);
                
                // Remove blocked label
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name: 'blocked'
                  });
                } catch (error) {
                  console.log(`Label 'blocked' not found on issue #${issue.number}`);
                }
                
                // Add ready label
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ['ready']
                });
                
                // Determine agent type from labels
                const agentLabels = ['backend', 'frontend', 'integration', 'qa'];
                const agentType = issue.labels.find(l => agentLabels.includes(l.name))?.name || 'agent';
                
                // Comment to notify
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `## 🎉 Dependencies Resolved!

            All dependencies for this issue have been completed:
            ${depStatuses.map(d => `- ✅ #${d.number}`).join('\n')}

            This issue is now **ready to start**.

            **@copilot** This ${agentType} issue is ready for implementation. Please follow the ${agentType} agent guidelines and implement the requirements.`
                });
              } else {
                console.log(`Issue #${issue.number} still has open dependencies:`, 
                  depStatuses.filter(d => !d.closed).map(d => d.number));
              }
            }
            
            // Update progress on parent orchestrator issue
            await updateOrchestratorProgress(github, context, closedIssue);

      - name: Handle issue ready (trigger agent)
        if: |
          github.event_name == 'issues' && 
          (
            (github.event.action == 'labeled' && github.event.label.name == 'ready') ||
            (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'ready'))
          )
        uses: actions/github-script@v7
        with:
           script: |
            const issue = context.payload.issue;
            const issueNumber = issue.number;
            
            // Determine agent type
            const agentLabels = {
              'backend': {
                emoji: '⚙️',
                name: 'Backend Agent',
                focus: 'API endpoints, database models, business logic'
              },
              'frontend': {
                emoji: '🎨',
                name: 'Frontend Agent',
                focus: 'UI components, user interactions, styling'
              },
              'integration': {
                emoji: '🔌',
                name: 'Integration Agent',
                focus: 'API clients, type definitions, service integration'
              },
              'qa': {
                emoji: '🧪',
                name: 'QA Agent',
                focus: 'test scenarios, test automation, quality assurance'
              }
            };
            
            let agentType = null;
            let agentInfo = null;
            
            for (const label of issue.labels) {
              if (agentLabels[label.name]) {
                agentType = label.name;
                agentInfo = agentLabels[label.name];
                break;
              }
            }
            
            if (!agentType) {
              console.log('No agent type found for issue');
              return;
            }
            
            // Idempotency: check if we already posted a "Ready to Start" comment
            const existingComments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });
            const alreadyPosted = existingComments.data.some(c => 
              c.body.includes('Ready to Start') && c.user.login === 'github-actions[bot]'
            );
            if (alreadyPosted) {
              console.log(`Skipping duplicate "Ready to Start" comment for issue #${issueNumber}`);
              return;
            }
            
            // Post agent-specific instructions (no @mention to avoid tagging real users)
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `## ${agentInfo.emoji} ${agentInfo.name} - Ready to Start!

            This issue is now ready for implementation.

            **Your focus areas:**
            - ${agentInfo.focus}

            **Implementation checklist:**
            - [ ] Read the issue requirements carefully
            - [ ] Review any related issues or dependencies
            - [ ] Implement the functionality
            - [ ] Write comprehensive tests
            - [ ] Update relevant documentation
            - [ ] Open a Pull Request following the PR template
            - [ ] Link the PR to this issue

            > The **Agent Worker** will automatically begin implementation. To manually trigger, comment \`/implement\` on this issue.

            **Guidelines:** See [\`.github/copilot-instructions.md\`](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/.github/copilot-instructions.md) for ${agentType} agent specifications.`
            });

      - name: Handle PR opened
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const prBody = pr.body || '';
            
            // Extract linked issues from PR body (look for "Closes #N" pattern specifically)
            const closeMatches = prBody.match(/(?:Closes|Fixes|Resolves)\s+#(\d+)/gi);
            const issueNumbers = closeMatches
              ? closeMatches.map(m => parseInt(m.match(/#(\d+)/)[1]))
              : [];
            
            if (issueNumbers.length === 0) {
              console.log('No issues linked in PR via Closes/Fixes/Resolves');
              return;
            }
            
            for (const issueNumber of issueNumbers) {
              try {
                // Add in-review label to the issue
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: ['in-review']
                });
                
                // Remove ready label if present
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: 'ready'
                }).catch(() => {});
                
                // Comment on the issue
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `## 🔄 Pull Request Opened

            A pull request has been opened for this issue:
            - PR #${pr.number}: ${pr.title}
            - Link: ${pr.html_url}

            **Status:** In Review

            Please review the changes and provide feedback.`
                });
              } catch (error) {
                console.log(`Error updating issue #${issueNumber}: ${error.message}`);
              }
            }

      - name: Handle PR merged
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
        uses: actions/github-script@v7
        with:
          script: |
            const { updateOrchestratorProgress } = require('./scripts/orchestrator-progress-helper');
            const pr = context.payload.pull_request;
            const prBody = pr.body || '';
            
            // Extract linked issues (look for "Closes #N" pattern specifically)
            const closeMatches = prBody.match(/(?:Closes|Fixes|Resolves)\s+#(\d+)/gi);
            const issueNumbers = closeMatches
              ? closeMatches.map(m => parseInt(m.match(/#(\d+)/)[1]))
              : [];
            
            if (issueNumbers.length === 0) {
              console.log('No issues linked in PR via Closes/Fixes/Resolves');
              return;
            }
            
            for (const issueNumber of issueNumbers) {
              try {
                // Close the issue
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: 'closed'
                });
                
                // Comment on the issue
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `## ✅ Completed

            This issue has been completed and merged:
            - PR #${pr.number}: ${pr.title}
            - Merged by: @${pr.merged_by.login}

            **Status:** Done

            Thank you for the contribution! 🎉`
                });

                // Update orchestrator progress
                await updateOrchestratorProgress(github, context, issueNumber);
              } catch (error) {
                console.log(`Error closing issue #${issueNumber}: ${error.message}`);
              }
            }
      - name: Auto-rebase open agent PRs
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
        uses: actions/github-script@v7
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MERGED_PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const { autoRebaseOpenPRs } = require('./scripts/auto-rebase');
            await autoRebaseOpenPRs(github, context);

      - name: Manual auto-rebase/resolve trigger
        if: |
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          (github.event.comment.body == '/resolve' || github.event.comment.body == '/rebase')
        uses: actions/github-script@v7
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const { autoRebaseOpenPRs } = require('./scripts/auto-rebase');
            const prNumber = context.payload.issue.number;
            await autoRebaseOpenPRs(github, context, prNumber);

      - name: Inter-agent communication
        if: github.event_name == 'issues' && github.event.action == 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const closedIssue = context.payload.issue;
            const closedNumber = closedIssue.number;
            const closedLabels = closedIssue.labels.map(l => l.name);
            
            // Communication patterns
            const communications = {
              'backend': ['integration', 'qa'],
              'integration': ['frontend', 'qa'],
              'frontend': ['qa']
            };
            
            // Find agent type of closed issue
            let agentType = null;
            for (const label of closedLabels) {
              if (communications[label]) {
                agentType = label;
                break;
              }
            }
            
            if (!agentType) {
              console.log('No agent communication needed');
              return;
            }
            
            // Find related issues to notify
            const nextAgents = communications[agentType];
            
            // Get all open issues with parent reference
            const { data: allIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            
            // Find issues for next agents that reference the same parent
            const parentMatch = (closedIssue.body || '').match(/Parent Issue:\s*#(\d+)/i);
            const parentIssue = parentMatch ? parseInt(parentMatch[1]) : null;
            
            if (!parentIssue) {
              console.log('No parent issue found');
              return;
            }
            
            for (const issue of allIssues) {
              const issueBody = issue.body || '';
              const issueLabels = issue.labels.map(l => l.name);
              
              // Check if this issue is for one of the next agents and shares the same parent
              const isNextAgent = nextAgents.some(agent => issueLabels.includes(agent));
              const sameParent = issueBody.includes(`Parent Issue: #${parentIssue}`);
              
              if (isNextAgent && sameParent) {
                const agentName = nextAgents.find(agent => issueLabels.includes(agent));
                
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `## 📢 Upstream Dependency Completed

            The ${agentType} work has been completed:
            - ✅ #${closedNumber} - ${closedIssue.title}

            **Impact on this issue:**
            - You may now have new APIs/clients/components available
            - Check the PR for implementation details
            - Ensure your work integrates correctly with the completed work

            ${issueLabels.includes('ready') ? '**This issue is ready to start!** @copilot please begin implementation.' : ''}`
                });
              }
            }

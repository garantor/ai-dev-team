name: Orchestrator - Handle Approval

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  handle_approval:
    runs-on: ubuntu-latest
    # Only run on orchestrator issues with awaiting-approval label
    if: |
      contains(github.event.issue.labels.*.name, 'orchestrator') &&
      contains(github.event.issue.labels.*.name, 'awaiting-approval')
    
    steps:
      - name: Check if commenter is authorized
        id: check_auth
        uses: actions/github-script@v7
        with:
          script: |
            const commenter = context.payload.comment.user.login;
            const issueCreator = context.payload.issue.user.login;
            
            // Check if commenter is issue creator
            if (commenter === issueCreator) {
              core.setOutput('authorized', 'true');
              return true;
            }
            
            // Check if commenter is a collaborator
            try {
              const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: commenter
              });
              
              const authorized = ['admin', 'write'].includes(permission.permission);
              core.setOutput('authorized', authorized.toString());
              return authorized;
            } catch (error) {
              core.setOutput('authorized', 'false');
              return false;
            }

      - name: Parse comment command
        id: parse_command
        if: steps.check_auth.outputs.authorized == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment.body.trim();
            const commentUpper = comment.toUpperCase();
            
            let command = 'none';
            if (commentUpper === 'APPROVE') {
              command = 'approve';
            } else if (commentUpper.startsWith('REVISE:')) {
              command = 'revise';
            } else if (commentUpper === 'REJECT') {
              command = 'reject';
            }
            
            core.setOutput('command', command);
            return command;

      - name: Handle APPROVE
        if: steps.parse_command.outputs.command == 'approve'
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;
            
            // Add labels
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              labels: ['approved', 'creating-issues']
            });
            
            // Remove awaiting-approval label
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              name: 'awaiting-approval'
            }).catch(() => {});
            
            // Post confirmation comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: `## ✅ Plan Approved!

          Thank you for approving the plan, @${context.payload.comment.user.login}!

          **Next steps:**
          1. 🤖 Automated issue creation is starting...
          2. 📝 All agent issues will be created with proper dependencies
          3. 🔗 Issues will be linked back to this orchestrator issue
          4. 🚀 Agents will be notified to start work

          **Track progress:**
          - All created issues will be commented below
          - Daily progress reports will be posted automatically
          - You can check status anytime with the orchestrator dashboard

          ⏳ Please wait 1-2 minutes for issue creation to complete...`
            });

      - name: Handle REVISE
        if: steps.parse_command.outputs.command == 'revise'
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;
            
            // Post acknowledgment comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: `## 🔄 Revision Requested

          Thank you for the feedback, @${context.payload.comment.user.login}!

          **Status:**
          - ✅ Revision request received
          - 🤖 Product Agent is regenerating the plan
          - ⏳ New plan will be posted shortly (1-2 minutes)

          The revised plan will incorporate your feedback and be posted as a new comment for your review.`
            });
            
            // The orchestrator-analyze workflow will handle the actual revision
            // It's triggered by comments starting with "REVISE:" on awaiting-approval issues

      - name: Handle REJECT
        if: steps.parse_command.outputs.command == 'reject'
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;
            
            // Add rejected label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              labels: ['rejected']
            });
            
            // Remove awaiting-approval label
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              name: 'awaiting-approval'
            }).catch(() => {});
            
            // Post thank you comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: `## ❌ Orchestration Cancelled

          Thank you for your consideration, @${context.payload.comment.user.login}.

          This orchestration request has been cancelled. No issues will be created.

          **If you change your mind:**
          - You can reopen this issue
          - Or create a new orchestrator issue with an updated idea

          Thank you for using the AI Dev Team! 🚀`
            });
            
            // Close the issue
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              state: 'closed'
            });

      - name: Handle unauthorized comment
        if: steps.check_auth.outputs.authorized == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment.body.trim().toUpperCase();
            
            // Only respond to command-like comments
            if (comment === 'APPROVE' || comment.startsWith('REVISE:') || comment === 'REJECT') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⚠️ @${context.payload.comment.user.login} - Only the issue creator (@${context.payload.issue.user.login}) or repository collaborators can approve, revise, or reject this orchestration.`
              });
            }

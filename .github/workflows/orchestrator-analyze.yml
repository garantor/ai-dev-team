name: Orchestrator - Analyze and Generate Plan

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to analyze (for manual testing)'
        required: true
        type: number

permissions:
  issues: write
  contents: read

# Prevent concurrent runs for the same issue - coordinate with acknowledge workflow
concurrency:
  group: orchestrator-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Basic filter - actual label validation happens in the first step
    # to ensure we check CURRENT labels, not stale event payload labels
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && 
       contains(github.event.issue.labels.*.name, 'orchestrator')) ||
      (github.event_name == 'issue_comment' && 
       contains(github.event.issue.labels.*.name, 'orchestrator') && 
       startsWith(github.event.comment.body, 'REVISE:'))
    
    steps:
      - name: Check current labels
        id: check_labels
        uses: actions/github-script@v7
        with:
          script: |
            // Get issue number from event or workflow_dispatch input
            const issueNumber = context.issue?.number || 
              (context.payload.inputs && parseInt(context.payload.inputs.issue_number));
            
            if (!issueNumber) {
              core.setFailed('No issue number found');
              return;
            }
            
            console.log(`Checking issue #${issueNumber}`);
            
            // Fetch current issue state from API (not stale event payload)
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });
            
            const labels = issue.data.labels.map(l => l.name);
            const hasOrchestrator = labels.includes('orchestrator');
            const hasNeedsPlanning = labels.includes('needs-planning');
            const hasProcessing = labels.includes('processing');
            const hasAwaitingApproval = labels.includes('awaiting-approval');
            
            let shouldRun = false;
            let reason = '';
            
            if (context.eventName === 'workflow_dispatch') {
              // For manual dispatch, same rules as issues event
              shouldRun = hasOrchestrator && hasNeedsPlanning && hasProcessing;
              reason = shouldRun ? 'Issue has required labels (manual dispatch)' : 
                `Missing labels: orchestrator=${hasOrchestrator}, needs-planning=${hasNeedsPlanning}, processing=${hasProcessing}`;
            } else if (context.eventName === 'issues') {
              // For issue events, need orchestrator + needs-planning + processing
              shouldRun = hasOrchestrator && hasNeedsPlanning && hasProcessing;
              reason = shouldRun ? 'Issue has required labels' : 
                `Missing labels: orchestrator=${hasOrchestrator}, needs-planning=${hasNeedsPlanning}, processing=${hasProcessing}`;
            } else if (context.eventName === 'issue_comment') {
              // For REVISE comments, need orchestrator + awaiting-approval
              const comment = context.payload.comment.body || '';
              const isRevise = comment.trim().toUpperCase().startsWith('REVISE:');
              shouldRun = hasOrchestrator && hasAwaitingApproval && isRevise;
              reason = shouldRun ? 'Valid REVISE request' : 
                `Not a valid REVISE request: orchestrator=${hasOrchestrator}, awaiting-approval=${hasAwaitingApproval}, isRevise=${isRevise}`;
            }
            
            console.log(`Labels: ${labels.join(', ')}`);
            console.log(`Should run: ${shouldRun}`);
            console.log(`Reason: ${reason}`);
            
            // Store issue number for later steps
            core.setOutput('issue_number', issueNumber);
            core.setOutput('should_run', shouldRun);
            core.setOutput('reason', reason);
            return shouldRun;

      - name: Skip if conditions not met
        if: steps.check_labels.outputs.should_run != 'true'
        run: |
          echo "⏭️ Skipping workflow: ${{ steps.check_labels.outputs.reason }}"
          echo "This is expected if the workflow was triggered before all labels were applied."

      - name: Checkout repository
        if: steps.check_labels.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Extract issue details
        if: steps.check_labels.outputs.should_run == 'true'
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            
            // Extract product idea from issue body
            const ideaMatch = body.match(/### 💡 Your Product Idea\s+([\s\S]*?)(?=###|$)/i) ||
                             body.match(/## 💡 Product Idea\s+([\s\S]*?)(?=##|$)/i);
            const productIdea = ideaMatch ? ideaMatch[1].trim() : body;
            
            // Extract additional context
            const contextMatch = body.match(/### 📝 Additional Context.*?\s+([\s\S]*?)(?=###|$)/i) ||
                                body.match(/## 📝 Additional Context\s+([\s\S]*?)(?=##|$)/i);
            const additionalContext = contextMatch ? contextMatch[1].trim() : '';
            
            // Extract priority
            const priorityMatch = body.match(/### ⚡ Priority\s+([\s\S]*?)(?=###|$)/i) ||
                                 body.match(/## ⚡ Priority\s+([\s\S]*?)(?=##|$)/i);
            const priority = priorityMatch ? priorityMatch[1].trim() : 'Medium';
            
            // Check if this is a revision
            let revisionFeedback = '';
            if (context.eventName === 'issue_comment') {
              const comment = context.payload.comment.body;
              const reviseMatch = comment.match(/REVISE:\s*([\s\S]*)/i);
              revisionFeedback = reviseMatch ? reviseMatch[1].trim() : '';
            }
            
            core.setOutput('product_idea', productIdea);
            core.setOutput('additional_context', additionalContext);
            core.setOutput('priority', priority);
            core.setOutput('revision_feedback', revisionFeedback);
            core.setOutput('is_revision', revisionFeedback !== '');
            
            return {
              productIdea,
              additionalContext,
              priority,
              revisionFeedback,
              isRevision: revisionFeedback !== ''
            };

      - name: Get previous plan for revision
        id: get_previous_plan
        if: steps.check_labels.outputs.should_run == 'true' && steps.extract.outputs.is_revision == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number
            });
            
            // Find the most recent plan (look for "## 🎯 PROJECT OVERVIEW" or similar)
            const planComments = comments.data.filter(c => 
              c.body.includes('## 🎯 PROJECT OVERVIEW') || 
              c.body.includes('## 📊 PRODUCT PLAN') ||
              c.body.includes('GITHUB ISSUES TO CREATE')
            );
            
            const previousPlan = planComments.length > 0 ? 
              planComments[planComments.length - 1].body : '';
            
            core.setOutput('previous_plan', previousPlan);
            return previousPlan;

      - name: Generate plan with AI
        if: steps.check_labels.outputs.should_run == 'true'
        id: generate_plan
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the AI prompt
          PRODUCT_IDEA="${{ steps.extract.outputs.product_idea }}"
          ADDITIONAL_CONTEXT="${{ steps.extract.outputs.additional_context }}"
          PRIORITY="${{ steps.extract.outputs.priority }}"
          IS_REVISION="${{ steps.extract.outputs.is_revision }}"
          REVISION_FEEDBACK="${{ steps.extract.outputs.revision_feedback }}"
          PREVIOUS_PLAN="${{ steps.get_previous_plan.outputs.previous_plan }}"
          
          # Build the prompt
          if [ "$IS_REVISION" = "true" ]; then
            PROMPT="You are a Product Agent AI for an automated development team.

          A user has requested revisions to a previous plan.

          ORIGINAL PRODUCT IDEA:
          $PRODUCT_IDEA

          ADDITIONAL CONTEXT:
          $ADDITIONAL_CONTEXT

          PREVIOUS PLAN:
          $PREVIOUS_PLAN

          REVISION FEEDBACK:
          $REVISION_FEEDBACK

          Generate an IMPROVED plan incorporating the feedback. Keep the same structure but address the concerns."
          else
            PROMPT="You are a Product Agent AI for an automated development team.

          A user submitted this product idea:

          PRODUCT IDEA:
          $PRODUCT_IDEA

          ADDITIONAL CONTEXT:
          $ADDITIONAL_CONTEXT

          PRIORITY:
          $PRIORITY

          Generate a comprehensive implementation plan with the following sections (use exactly these headers):

          ## 🎯 PROJECT OVERVIEW
          - Summary (one sentence)
          - Target users
          - Core value proposition

          ## ✨ FEATURES BREAKDOWN
          ### P0 - Must Have
          (List critical features)
          
          ### P1 - Should Have
          (List important features)
          
          ### P2 - Nice to Have
          (List optional features)

          ## 📖 USER STORIES
          For each major feature, provide:
          - As a [user type], I want [goal] so that [benefit]
          - Acceptance Criteria (as checklist items)

          ## 🏗️ TECHNICAL ARCHITECTURE
          - Tech Stack (specific technologies)
          - System Architecture (ASCII diagram)
          - Database Schema (if needed)
          - API Endpoints (if applicable)

          ## 👥 AGENT TASK BREAKDOWN
          ### Backend Agent Tasks
          (List specific backend implementation tasks)
          
          ### Integration Agent Tasks
          (List API client and integration tasks)
          
          ### Frontend Agent Tasks
          (List UI/UX implementation tasks)
          
          ### QA Agent Tasks
          (List testing and quality assurance tasks)

          ## 📅 IMPLEMENTATION TIMELINE
          Break down into phases (Week 1, Week 2, etc.)

          ## 📝 GITHUB ISSUES TO CREATE
          For each issue, provide:
          - Issue title (format: [AGENT-TYPE] Description)
          - Template to use
          - Labels
          - Parent issue (if applicable)
          - Dependencies (which issues must be completed first)
          - Full description with deliverables

          Format the entire response as structured markdown that can be directly posted to GitHub."
          fi
          
          # Check if Google API key is available
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "⚠️ GOOGLE_API_KEY not configured. Using fallback template-based plan." >> $GITHUB_STEP_SUMMARY
            
            # Create a template-based plan
            PLAN="## 🎯 PROJECT OVERVIEW

          **Summary:** $PRODUCT_IDEA

          **Target Users:** To be determined based on product requirements

          **Value Proposition:** Automated implementation using AI agent team

          ---

          ## ⚠️ Manual Planning Required

          The automated AI plan generation requires a Google Gemini API key to be configured in repository secrets.

          **To enable automated planning:**
          1. Go to repository Settings > Secrets and variables > Actions
          2. Add a secret named \`GOOGLE_API_KEY\` with your Google Gemini API key
          3. Get your API key from: https://makersuite.google.com/app/apikey
          4. Close this issue and create a new one to trigger automated planning

          **Alternative options:**
          1. **Use ChatGPT/Claude manually:**
             - Copy the product idea above
             - Paste into ChatGPT with the Product Agent prompt from [AI_ORCHESTRATOR_GUIDE.md](../docs/AI_ORCHESTRATOR_GUIDE.md)
             - Post the AI response as a comment on this issue
             - Comment \`APPROVE\` when ready

          2. **Use GitHub Copilot:**
             - Open this issue in VS Code
             - Use Copilot Chat: \`@workspace analyze this issue and create implementation plan\`
             - Copy the response and post as a comment

          3. **Manual planning:**
             - Review the issue templates
             - Create issues manually for each agent

          ---

          ## 📝 NEXT STEPS

          Once you have a complete plan (either from AI or manual), post it as a comment and then comment:
          - \`APPROVE\` to proceed with issue creation
          - \`REVISE: [feedback]\` to request changes
          - \`REJECT\` to cancel"
          else
            # Call Google Gemini API
            REQUEST_BODY=$(jq -n \
              --arg text "$PROMPT" \
              '{
                contents: [{
                  parts: [{
                    text: $text
                  }]
                }],
                generationConfig: {
                  temperature: 0.7,
                  topK: 40,
                  topP: 0.95,
                  maxOutputTokens: 8192
                }
              }')
            
            RESPONSE=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=$GOOGLE_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$REQUEST_BODY")
            
            # Check for API errors
            if echo "$RESPONSE" | jq -e '.error' > /dev/null; then
              ERROR_MSG=$(echo "$RESPONSE" | jq -r '.error.message // .error')
              ERROR_CODE=$(echo "$RESPONSE" | jq -r '.error.code // "unknown"')
              echo "❌ Google Gemini API Error: $ERROR_MSG (Code: $ERROR_CODE)" >> $GITHUB_STEP_SUMMARY
              
              PLAN="## ⚠️ API Error

          Failed to generate plan automatically: $ERROR_MSG

          **Common Issues:**
          1. **Missing API Key**: Ensure \`GOOGLE_API_KEY\` is configured in repository secrets
          2. **API Quota**: Check if you've exceeded your Gemini API quota
          3. **Invalid API Key**: Verify your Google API key is valid and has Gemini API enabled

          **What you can do:**
          1. **Check secrets**: Go to [Repository Settings → Secrets](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/settings/secrets/actions)
          2. **Verify API key**: Ensure your Google API key is valid at https://makersuite.google.com/app/apikey
          3. **Try again**: Remove and re-add the \`orchestrator\` label to retry

          **Or use manual options** described in the [AI Orchestrator Guide](../docs/AI_ORCHESTRATOR_GUIDE.md)."
            else
              # Extract the generated plan from Gemini response
              PLAN=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')
              
              if [ -z "$PLAN" ]; then
                echo "❌ Failed to extract plan from Gemini response" >> $GITHUB_STEP_SUMMARY
                PLAN="## ⚠️ Response Parsing Error

          Received a response from Google Gemini but failed to extract the plan. This might be a temporary issue.

          Please try removing and re-adding the \`orchestrator\` label to retry, or use one of the manual options in the [AI Orchestrator Guide](../docs/AI_ORCHESTRATOR_GUIDE.md)."
              fi
            fi
          fi
          
          # Save plan to file for next step
          echo "$PLAN" > /tmp/generated_plan.md
          
          # Output summary
          echo "✅ Plan generated successfully" >> $GITHUB_STEP_SUMMARY

      - name: Post plan as comment
        if: steps.check_labels.outputs.should_run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('/tmp/generated_plan.md', 'utf8');
            const isRevision = '${{ steps.extract.outputs.is_revision }}' === 'true';
            
            let commentBody = '';
            if (isRevision) {
              // Get the version number
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
              });
              const planCount = comments.data.filter(c => 
                c.body.includes('## 🎯 PROJECT OVERVIEW') || 
                c.body.includes('Revised Plan v')
              ).length;
              const version = planCount + 1;
              
              const username = context.payload.comment.user.login;
              commentBody = [
                `# 🔄 Revised Plan v${version}`,
                '',
                `_Revision requested by:_ @${username}`,
                '',
                '---',
                '',
                plan,
                '',
                '---',
                '',
                '## ✅ APPROVAL REQUIRED',
                '',
                'Please review this revised plan and comment:',
                '- `APPROVE` to proceed with creating all issues',
                '- `REVISE: [your feedback]` to request more changes',
                '- `REJECT` to cancel this orchestration'
              ].join('\n');
            } else {
              commentBody = [
                '# 📋 Product Agent Analysis',
                '',
                'Thank you for submitting your idea! Here is the comprehensive implementation plan:',
                '',
                '---',
                '',
                plan,
                '',
                '---',
                '',
                '## ✅ APPROVAL REQUIRED',
                '',
                'Please review this plan and comment:',
                '- `APPROVE` to proceed with creating all issues',
                '- `REVISE: [your feedback]` to request changes',
                '- `REJECT` to cancel this orchestration',
                '',
                'Once approved, all issues will be automatically created with proper dependencies and labels.'
              ].join('\n');
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });

      - name: Update issue labels
        if: steps.check_labels.outputs.should_run == 'true' && steps.extract.outputs.is_revision == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            // Remove needs-planning and processing, add awaiting-approval
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'needs-planning'
            }).catch(() => {}); // Ignore if label doesn't exist
            
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'processing'
            }).catch(() => {}); // Ignore if label doesn't exist
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['awaiting-approval']
            });
